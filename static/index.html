<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EyeTracker — AI Retinal Screening</title>
<meta name="description" content="EyeTracker uses deep learning to screen retinal fundus photos for eight eye conditions. Upload a photo and get instant AI-powered analysis.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   DESIGN TOKENS — Premium Dark Theme
   ═══════════════════════════════════════════════════════════ */
:root {
  --bg-body: #06080d;
  --bg-panel: rgba(10, 14, 22, 0.88);
  --bg-panel-solid: #0a0e16;
  --bg-card: rgba(16, 22, 36, 0.55);
  --bg-card-hover: rgba(24, 32, 52, 0.65);
  --bg-elevated: rgba(20, 28, 48, 0.5);
  --glass-border: rgba(255, 255, 255, 0.05);
  --glass-border-hover: rgba(255, 255, 255, 0.1);
  --glass-border-active: rgba(255, 255, 255, 0.15);

  --ink: #edf0f7;
  --ink-secondary: #8892a8;
  --ink-tertiary: #505a70;
  --ink-faint: #3a4258;

  --accent: #6366f1;
  --accent-light: #818cf8;
  --accent-dim: rgba(99, 102, 241, 0.1);
  --accent-glow: rgba(99, 102, 241, 0.2);
  --accent-vivid: #a78bfa;

  --gradient-main: linear-gradient(135deg, #6366f1, #8b5cf6, #a78bfa);
  --gradient-text: linear-gradient(135deg, #818cf8 0%, #c084fc 50%, #f0abfc 100%);
  --gradient-warm: linear-gradient(135deg, #f97316, #f59e0b);
  --gradient-surface: linear-gradient(180deg, rgba(16, 22, 36, 0.6) 0%, rgba(10, 14, 22, 0.9) 100%);

  --flag: #ef4444;
  --flag-soft: #fca5a5;
  --flag-dim: rgba(239, 68, 68, 0.08);
  --flag-border: rgba(239, 68, 68, 0.2);
  --ok: #10b981;
  --ok-soft: #6ee7b7;
  --ok-dim: rgba(16, 185, 129, 0.08);
  --ok-border: rgba(16, 185, 129, 0.2);
  --caution: #f59e0b;
  --caution-dim: rgba(245, 158, 11, 0.08);
  --caution-border: rgba(245, 158, 11, 0.2);

  --bar-track: rgba(255, 255, 255, 0.04);

  --radius-xs: 6px;
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 18px;
  --radius-xl: 24px;
  --radius-2xl: 32px;

  --shadow-xs: 0 1px 2px rgba(0,0,0,0.4);
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 24px rgba(0,0,0,0.35);
  --shadow-lg: 0 12px 48px rgba(0,0,0,0.45);
  --shadow-glow: 0 0 60px rgba(99, 102, 241, 0.06);
  --shadow-glow-strong: 0 0 80px rgba(99, 102, 241, 0.12);

  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --t-fast: 0.15s ease;
  --t-normal: 0.3s var(--ease-out);
  --t-slow: 0.5s var(--ease-out);
}

/* ═══════════════════════════════════════════════════════════
   RESET & BASE
   ═══════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  background: var(--bg-body);
  scroll-behavior: smooth;
  scrollbar-width: thin;
  scrollbar-color: var(--ink-faint) transparent;
}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--ink-faint); border-radius: 3px; }

body {
  color: var(--ink);
  background: var(--bg-body);
  font: 400 14.5px/1.65 'Inter', system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
  letter-spacing: -0.006em;
}

h1, h2, h3, h4 { font-family: 'Outfit', sans-serif; font-weight: 600; letter-spacing: -0.02em; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
a { color: var(--accent-light); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

/* ═══════════════════════════════════════════════════════════
   ANIMATED BACKGROUND — Mesh Gradient
   ═══════════════════════════════════════════════════════════ */
.ambient {
  position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
}
.ambient .orb {
  position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.35;
}
.ambient .orb-1 {
  width: 700px; height: 700px; top: -200px; right: -150px;
  background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
  animation: orbit1 25s ease-in-out infinite;
}
.ambient .orb-2 {
  width: 500px; height: 500px; bottom: -100px; left: -100px;
  background: radial-gradient(circle, rgba(168, 85, 247, 0.12) 0%, transparent 70%);
  animation: orbit2 30s ease-in-out infinite;
}
.ambient .orb-3 {
  width: 400px; height: 400px; top: 40%; left: 35%;
  background: radial-gradient(circle, rgba(139, 92, 246, 0.08) 0%, transparent 70%);
  animation: orbit3 20s ease-in-out infinite;
}
.ambient .noise {
  position: absolute; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  background-size: 128px 128px;
  opacity: 0.4;
}
@keyframes orbit1 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  25% { transform: translate(-40px, 30px) scale(1.08); }
  50% { transform: translate(20px, -20px) scale(0.95); }
  75% { transform: translate(-15px, -30px) scale(1.03); }
}
@keyframes orbit2 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(50px, -30px) scale(1.1); }
  66% { transform: translate(-25px, 20px) scale(0.92); }
}
@keyframes orbit3 {
  0%, 100% { transform: translate(0, 0) scale(1) rotate(0deg); }
  50% { transform: translate(30px, -40px) scale(1.15) rotate(180deg); }
}

/* ═══════════════════════════════════════════════════════════
   LAYOUT
   ═══════════════════════════════════════════════════════════ */
.app {
  position: relative; z-index: 1;
  display: grid;
  grid-template-columns: 420px 1fr;
  min-height: 100vh;
}

/* ═══════════════════════════════════════════════════════════
   LEFT PANEL (SIDEBAR)
   ═══════════════════════════════════════════════════════════ */
.side {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  padding: 36px 30px 40px;
  background: var(--bg-panel);
  backdrop-filter: blur(40px) saturate(1.3);
  -webkit-backdrop-filter: blur(40px) saturate(1.3);
  border-right: 1px solid var(--glass-border);
  display: flex; flex-direction: column; gap: 24px;
  scrollbar-width: thin;
  scrollbar-color: var(--ink-faint) transparent;
}
.side::-webkit-scrollbar { width: 4px; }
.side::-webkit-scrollbar-thumb { background: var(--ink-faint); border-radius: 2px; }

/* — Brand — */
.brand {
  display: flex; align-items: center; gap: 14px;
}
.brand-icon {
  width: 44px; height: 44px; flex: none;
  border-radius: 12px;
  background: var(--gradient-main);
  display: grid; place-items: center;
  box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3), inset 0 1px 0 rgba(255,255,255,0.15);
  position: relative;
  overflow: hidden;
}
.brand-icon::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 50%);
}
.brand-icon svg { width: 22px; height: 22px; position: relative; z-index: 1; }
.brand h1 {
  font-size: 1.5rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1;
}
.brand-tag {
  display: inline-block; margin-top: 3px;
  font-family: 'Inter', sans-serif;
  font-size: 0.6rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
  background: var(--gradient-text);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}

.lede {
  color: var(--ink-secondary);
  font-size: 0.86rem; max-width: 34ch; line-height: 1.6;
}

/* — Status Badge — */
.status {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 7px 14px;
  background: var(--bg-card);
  border: 1px solid var(--glass-border);
  border-radius: 999px;
  font-size: 0.76rem; font-weight: 500; color: var(--ink-secondary);
  width: fit-content;
  transition: all var(--t-normal);
  backdrop-filter: blur(12px);
}
.dot {
  width: 7px; height: 7px; border-radius: 50%; flex: none;
  background: var(--caution);
  transition: background var(--t-normal), box-shadow var(--t-normal);
}
.status.ready .dot { background: var(--ok); box-shadow: 0 0 10px rgba(16, 185, 129, 0.5); }
.status.error .dot { background: var(--flag); box-shadow: 0 0 10px rgba(239, 68, 68, 0.4); }
.status.loading .dot { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.2; transform: scale(0.7); } }

/* — Section Cards — */
.group {
  background: var(--bg-card);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  padding: 22px;
  transition: border-color var(--t-normal), box-shadow var(--t-normal);
  backdrop-filter: blur(8px);
}
.group:hover {
  border-color: var(--glass-border-hover);
  box-shadow: var(--shadow-glow);
}
.group h2 {
  font-size: 0.95rem; font-weight: 600; margin-bottom: 16px;
  display: flex; align-items: center; gap: 10px;
  color: var(--ink);
}
.group h2::before {
  content: '';
  width: 3px; height: 16px;
  background: var(--gradient-main);
  border-radius: 2px;
  flex: none;
}

/* — Mode Switcher — */
.seg {
  display: inline-flex;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  overflow: hidden;
  margin-bottom: 18px;
  padding: 3px;
  gap: 2px;
}
.seg button {
  background: transparent;
  padding: 6px 16px; font-size: 0.8rem; font-weight: 500;
  color: var(--ink-secondary);
  border-radius: 7px;
  transition: all var(--t-normal);
}
.seg button:hover { color: var(--ink); background: rgba(255,255,255,0.05); }
.seg button[aria-pressed="true"] {
  background: var(--gradient-main); color: #fff; font-weight: 600;
  box-shadow: 0 2px 12px rgba(99, 102, 241, 0.3);
}

/* — Upload Slots — */
.slots { display: flex; gap: 18px; flex-wrap: wrap; }
.slot { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; max-width: 100%; }
.drop { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; cursor: pointer; max-width: 100%; }

.lens {
  --size: 170px;
  width: var(--size); height: var(--size); border-radius: var(--radius-xl);
  border: 2px dashed var(--ink-faint);
  display: grid; place-items: center; text-align: center;
  color: var(--ink-tertiary); font-size: 0.78rem; padding: 22px;
  background: rgba(255,255,255,0.015);
  overflow: hidden; position: relative;
  transition: all var(--t-normal);
}
.lens::before {
  content: ''; position: absolute; inset: -3px;
  border-radius: var(--radius-xl);
  background: conic-gradient(from 0deg, transparent 0%, var(--accent) 25%, transparent 50%);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  padding: 2px;
  opacity: 0;
  transition: opacity var(--t-normal);
  animation: scanSpin 4s linear infinite;
}
@keyframes scanSpin { to { transform: rotate(360deg); } }
.drop:hover .lens::before { opacity: 0.5; }
.drop:hover .lens {
  border-color: var(--accent-light); background: var(--accent-dim);
  box-shadow: 0 0 30px rgba(99, 102, 241, 0.08);
}
.slots.both .lens { --size: 130px; }
.lens img { display: none; position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }

.drop.filled .lens {
  border: 2px solid var(--accent);
  background: #000;
  box-shadow: 0 4px 30px rgba(99, 102, 241, 0.15);
}
.drop.filled .lens::before { opacity: 0; }
.drop.filled .lens img { display: block; }
.drop.filled .hint { display: none; }
.drop:focus-within .lens { outline: 2px solid var(--accent); outline-offset: 3px; }

.slot-name { font-weight: 600; font-size: 0.85rem; color: var(--ink); letter-spacing: -0.01em; }
.file {
  font-size: 0.72rem; color: var(--ink-tertiary);
  max-width: 18ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-family: 'JetBrains Mono', monospace;
}
.linkbtn {
  background: none; padding: 0;
  color: var(--accent-light); text-decoration: none; cursor: pointer;
  font-size: 0.78rem; font-weight: 500;
  transition: opacity var(--t-fast);
}
.linkbtn:hover { opacity: 0.75; text-decoration: underline; }
.note-side { font-size: 0.8rem; color: var(--flag-soft); min-height: 1.2em; margin-top: 8px; }

/* — Sample Chips — */
.samples { display: flex; flex-wrap: wrap; gap: 8px; }
.samples button {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--glass-border);
  border-radius: 999px;
  padding: 6px 16px; font-size: 0.76rem; font-weight: 500;
  color: var(--ink-secondary);
  transition: all var(--t-normal);
}
.samples button:hover {
  border-color: var(--accent); color: var(--accent-light);
  background: var(--accent-dim);
  box-shadow: 0 0 16px rgba(99, 102, 241, 0.08);
  transform: translateY(-1px);
}
.samples-lead { font-size: 0.8rem; color: var(--ink-tertiary); margin-bottom: 10px; }

/* — Options — */
.opts { display: flex; flex-direction: column; gap: 12px; }
.opt {
  display: flex; gap: 10px; align-items: flex-start;
  font-size: 0.84rem; cursor: pointer; color: var(--ink-secondary);
  transition: color var(--t-fast);
}
.opt:hover { color: var(--ink); }
.opt input { margin-top: 4px; accent-color: var(--accent); }
.opt small { display: block; color: var(--ink-tertiary); font-size: 0.72rem; margin-top: 2px; }

/* — Analyze Button — */
.go {
  position: relative; overflow: hidden;
  background: var(--gradient-main);
  color: #fff; border: 0;
  border-radius: var(--radius-md);
  padding: 15px 24px; font-weight: 700; font-size: 0.92rem;
  width: 100%; letter-spacing: 0.01em;
  box-shadow: 0 4px 24px rgba(99, 102, 241, 0.25), inset 0 1px 0 rgba(255,255,255,0.15);
  transition: all var(--t-normal);
}
.go::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
  transform: translateX(-100%);
}
.go:hover:not(:disabled) {
  box-shadow: 0 8px 36px rgba(99, 102, 241, 0.4), inset 0 1px 0 rgba(255,255,255,0.2);
  transform: translateY(-2px);
}
.go:hover:not(:disabled)::before { animation: btnShimmer 0.8s ease; }
@keyframes btnShimmer { to { transform: translateX(100%); } }
.go:active:not(:disabled) { transform: translateY(0); }
.go:disabled { opacity: 0.3; cursor: not-allowed; box-shadow: none; }
.go-hint {
  font-size: 0.76rem; color: var(--ink-tertiary);
  margin-top: 8px; min-height: 1.2em;
}

/* ═══════════════════════════════════════════════════════════
   RIGHT PANEL (MAIN CONTENT)
   ═══════════════════════════════════════════════════════════ */
.main {
  padding: 48px clamp(28px, 5vw, 72px) 80px;
  max-width: 960px;
}

/* — Empty State — */
.empty { animation: fadeUp 0.6s var(--ease-out); }
.empty h2 {
  font-size: clamp(2.2rem, 4vw, 3.4rem); line-height: 1.08;
  max-width: 15ch; letter-spacing: -0.03em; font-weight: 700;
  background: var(--gradient-text);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.empty p {
  margin-top: 20px; color: var(--ink-secondary); max-width: 50ch;
  font-size: 0.92rem; line-height: 1.7;
}
.empty ul {
  margin: 28px 0 0; padding: 0; list-style: none;
  display: flex; flex-direction: column; gap: 12px;
  max-width: 50ch;
}
.empty li {
  display: flex; align-items: flex-start; gap: 12px;
  font-size: 0.86rem; color: var(--ink-tertiary);
  padding: 14px 18px;
  background: var(--bg-card);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-md);
  transition: border-color var(--t-normal);
}
.empty li:hover { border-color: var(--glass-border-hover); }
.empty li::before {
  content: '→';
  color: var(--accent-light); font-weight: 600; flex: none;
  margin-top: 1px;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

/* — Busy / Loading State — */
.busy { animation: fadeUp 0.5s var(--ease-out); }
.busy h2 {
  font-size: 1.7rem; font-weight: 700;
  background: var(--gradient-text);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.busy p { color: var(--ink-secondary); margin-top: 10px; max-width: 50ch; font-size: 0.9rem; }
.track {
  height: 3px;
  background: var(--bar-track);
  margin-top: 28px; max-width: 400px;
  overflow: hidden; border-radius: 2px;
}
.track i {
  display: block; height: 100%; width: 30%;
  background: var(--gradient-main);
  border-radius: 2px;
  animation: slide 1.8s ease-in-out infinite;
}
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(400%); } }
.elapsed {
  font-size: 0.78rem; color: var(--ink-tertiary); margin-top: 12px;
  font-family: 'JetBrains Mono', monospace;
}

/* — Error State — */
.error {
  animation: fadeUp 0.5s var(--ease-out);
  background: var(--flag-dim);
  border: 1px solid var(--flag-border);
  border-radius: var(--radius-lg);
  padding: 24px 28px;
  max-width: 60ch;
}
.error h2 { font-size: 1.3rem; color: var(--flag-soft); }
.error p { margin-top: 8px; color: var(--ink-secondary); font-size: 0.88rem; }

/* — Verdict Banner — */
.verdict {
  animation: fadeUp 0.6s var(--ease-out);
  position: relative;
  padding: 32px 0 28px;
}
.verdict::before {
  content: ''; position: absolute; top: 0; left: 0;
  width: 60px; height: 4px; border-radius: 2px;
}
.verdict h2 {
  font-size: clamp(2.2rem, 4.8vw, 3.6rem);
  line-height: 1.04; letter-spacing: -0.025em; font-weight: 800;
}
.verdict .sub {
  margin-top: 14px; font-size: 1.05rem; color: var(--ink-secondary);
  max-width: 42ch; line-height: 1.55;
}
.verdict .meta {
  margin-top: 14px; font-size: 0.78rem; color: var(--ink-tertiary);
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px;
  background: var(--bg-card);
  border: 1px solid var(--glass-border);
  border-radius: 999px;
  font-family: 'JetBrains Mono', monospace;
}
.verdict .meta::before { content: '⚡'; font-size: 0.85rem; }

.v-disease::before { background: linear-gradient(90deg, var(--flag), #f97316); }
.v-disease h2 { color: var(--flag-soft); }
.v-normal::before { background: linear-gradient(90deg, var(--ok), #34d399); }
.v-normal h2 { color: var(--ok-soft); }
.v-inconclusive::before { background: linear-gradient(90deg, var(--caution), #fbbf24); }
.v-inconclusive h2 { color: var(--caution); }

.caveat {
  margin-top: 20px;
  background: var(--caution-dim);
  border: 1px solid var(--caution-border);
  border-radius: var(--radius-md);
  padding: 14px 18px;
  font-size: 0.86rem; color: var(--ink-secondary);
  max-width: 60ch;
  display: flex; align-items: flex-start; gap: 10px;
}
.caveat::before { content: '⚠️'; flex: none; margin-top: 1px; }

/* — Section Dividers — */
.sec {
  margin-top: 48px; padding-top: 32px;
  border-top: 1px solid var(--glass-border);
  animation: fadeUp 0.6s var(--ease-out);
}
.sec > h2 {
  font-size: 1.4rem; font-weight: 700;
  display: flex; align-items: center; gap: 12px;
}
.sec > h2::before {
  content: '';
  width: 4px; height: 24px;
  background: var(--gradient-main);
  border-radius: 2px;
}
.sec > .lead {
  margin-top: 10px; color: var(--ink-tertiary);
  font-size: 0.86rem; max-width: 60ch; line-height: 1.6;
}

/* — Scores List — */
.scores { list-style: none; margin: 24px 0 0; padding: 0; display: grid; gap: 8px; }
.scores li {
  display: grid; grid-template-columns: 250px 1fr 52px; gap: 16px; align-items: center;
  padding: 12px 16px; border-radius: var(--radius-md);
  background: var(--bg-card);
  border: 1px solid var(--glass-border);
  transition: all var(--t-normal);
}
.scores li:hover {
  background: var(--bg-card-hover);
  border-color: var(--glass-border-hover);
  transform: translateX(4px);
}
.scores .nm {
  font-size: 0.86rem; font-family: 'Inter', sans-serif; font-weight: 400;
  color: var(--ink-secondary);
}
.scores li.flag .nm { font-weight: 600; color: var(--ink); }
.tag {
  margin-left: 8px; font-size: 0.62rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--flag-soft); background: var(--flag-dim);
  border: 1px solid var(--flag-border);
  border-radius: 5px; padding: 2px 8px;
  vertical-align: 1px;
}
.bar {
  height: 5px; background: var(--bar-track); border-radius: 3px; overflow: hidden;
}
.bar i {
  display: block; height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent-vivid));
  border-radius: 3px;
  transition: width 0.8s var(--ease-out);
}
.scores li.flag .bar i { background: linear-gradient(90deg, var(--flag), #fb923c); }
.val {
  text-align: right; font-variant-numeric: tabular-nums;
  font-size: 0.84rem; color: var(--ink-secondary); font-weight: 600;
  font-family: 'JetBrains Mono', monospace;
}

/* — Detail Cards — */
.detail {
  background: var(--bg-card);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-xl);
  padding: 28px;
  margin-top: 20px;
  transition: border-color var(--t-normal), box-shadow var(--t-normal);
  position: relative;
  overflow: hidden;
}
.detail::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: var(--gradient-main); opacity: 0.4;
}
.detail:hover {
  border-color: var(--glass-border-hover);
  box-shadow: var(--shadow-glow);
}
.detail + .detail { margin-top: 16px; }
.detail h3 {
  font-size: 1.25rem; font-weight: 700; margin-top: 0;
  color: var(--ink);
}
.rel {
  display: flex; align-items: center; gap: 12px;
  margin-top: 12px; font-size: 0.8rem; color: var(--ink-tertiary);
}
.relbar {
  width: 80px; height: 4px;
  background: var(--bar-track); border-radius: 2px; overflow: hidden; flex: none;
}
.relbar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.weak {
  margin-top: 12px; font-size: 0.84rem;
  color: var(--caution); background: var(--caution-dim);
  border: 1px solid var(--caution-border);
  padding: 10px 14px; border-radius: var(--radius-sm);
  max-width: 60ch;
}
dl.facts {
  margin: 22px 0 0; display: grid;
  grid-template-columns: 10rem 1fr; gap: 12px 24px; max-width: 72ch;
}
dl.facts dt {
  font-weight: 600; font-size: 0.84rem;
  color: var(--ink-secondary);
}
dl.facts dd { margin: 0; font-size: 0.84rem; color: var(--ink-tertiary); line-height: 1.6; }

/* — Eye Tabs — */
.eyes {
  display: inline-flex;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  overflow: hidden;
  margin: 20px 0 16px;
  padding: 3px; gap: 2px;
}
.eyes button {
  padding: 6px 16px; font-size: 0.8rem; font-weight: 500;
  color: var(--ink-secondary);
  border-radius: 7px;
  transition: all var(--t-normal);
}
.eyes button:hover { color: var(--ink); background: rgba(255,255,255,0.05); }
.eyes button[aria-pressed="true"] {
  background: var(--gradient-main); color: #fff; font-weight: 600;
  box-shadow: 0 2px 8px rgba(99, 102, 241, 0.2);
}

/* — Compare Slider — */
.compare {
  position: relative; width: 100%; max-width: 520px;
  margin-top: 18px; touch-action: pan-y; user-select: none; cursor: ew-resize;
  background: #000; border-radius: var(--radius-lg); overflow: hidden;
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--glass-border);
}
.eyes + .compare { margin-top: 0; }
.compare img { display: block; width: 100%; height: auto; pointer-events: none; }
.compare .over { position: absolute; inset: 0; clip-path: inset(0 0 0 var(--pos)); }
.compare .handle {
  position: absolute; top: 0; bottom: 0; left: var(--pos); width: 2px; margin-left: -1px;
  background: #fff; box-shadow: 0 0 12px rgba(0,0,0,0.6);
}
.compare .handle::after {
  content: ''; position: absolute; top: 50%; left: 50%;
  width: 28px; height: 28px; margin: -14px 0 0 -14px;
  border-radius: 50%; background: #fff;
  box-shadow: 0 0 0 2px rgba(0,0,0,0.15), 0 3px 12px rgba(0,0,0,0.3);
}
.slider {
  display: flex; align-items: center; gap: 12px;
  margin-top: 14px; max-width: 520px;
  font-size: 0.78rem; color: var(--ink-tertiary); font-weight: 500;
}
.slider input { flex: 1; accent-color: var(--accent); }
.cap { margin-top: 16px; font-size: 0.84rem; color: var(--ink-tertiary); max-width: 60ch; line-height: 1.6; }
.pending { margin-top: 16px; color: var(--ink-tertiary); max-width: 60ch; font-size: 0.86rem; }

/* — Disclaimer — */
.disclaimer {
  margin-top: 56px; padding-top: 24px;
  border-top: 1px solid var(--glass-border);
  font-size: 0.78rem; color: var(--ink-faint); max-width: 68ch;
  line-height: 1.6;
}

/* ═══════════════════════════════════════════════════════════
   AI EXPLANATION CARD
   ═══════════════════════════════════════════════════════════ */
.ai-explain {
  position: relative;
  background: linear-gradient(145deg, rgba(16, 22, 40, 0.7), rgba(24, 16, 44, 0.5));
  border: 1px solid rgba(129, 140, 248, 0.15);
  border-radius: var(--radius-xl);
  padding: 28px;
  margin-top: 22px;
  overflow: hidden;
  transition: border-color var(--t-normal), box-shadow var(--t-normal);
  backdrop-filter: blur(8px);
}
.ai-explain:hover {
  border-color: rgba(129, 140, 248, 0.3);
  box-shadow: 0 0 50px rgba(129, 140, 248, 0.06);
}
.ai-explain::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, #818cf8, #c084fc, #f0abfc);
  opacity: 0.6;
}
.ai-explain-header {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 20px;
}
.ai-explain-icon {
  width: 34px; height: 34px; flex: none;
  border-radius: 10px;
  background: linear-gradient(135deg, #818cf8, #c084fc);
  display: grid; place-items: center;
  box-shadow: 0 4px 16px rgba(129, 140, 248, 0.25);
  font-size: 1rem;
}
.ai-explain-header h3 {
  font-size: 1.05rem; font-family: 'Outfit', sans-serif; font-weight: 700;
  color: var(--ink);
  margin: 0; letter-spacing: -0.01em;
}
.ai-explain-header .provider-badge {
  margin-left: auto;
  font-size: 0.62rem; font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 4px 12px;
  border-radius: 999px;
  background: rgba(129, 140, 248, 0.1);
  border: 1px solid rgba(129, 140, 248, 0.2);
  color: var(--accent-vivid);
  white-space: nowrap;
}
.ai-explain-body {
  font-size: 0.88rem;
  color: var(--ink-secondary);
  line-height: 1.75;
}
.ai-explain-body p { margin: 0 0 12px; }
.ai-explain-body p:last-child { margin-bottom: 0; }
.ai-explain-body strong { color: var(--ink); font-weight: 600; }
.ai-explain-body ul, .ai-explain-body ol {
  margin: 10px 0 14px;
  padding-left: 1.4em;
}
.ai-explain-body li { margin-bottom: 6px; }
.ai-explain-body li::marker { color: var(--accent-vivid); }
.ai-explain-body blockquote {
  margin: 14px 0;
  padding: 12px 18px;
  border-left: 3px solid rgba(129, 140, 248, 0.35);
  background: rgba(129, 140, 248, 0.05);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  font-size: 0.82rem;
  color: var(--ink-tertiary);
  font-style: italic;
}
.ai-explain-body code {
  background: rgba(255,255,255,0.05);
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 0.82em;
  font-family: 'JetBrains Mono', monospace;
}
.ai-explain-body h1, .ai-explain-body h2, .ai-explain-body h3,
.ai-explain-body h4, .ai-explain-body h5, .ai-explain-body h6 {
  font-family: 'Outfit', sans-serif;
  font-weight: 600; color: var(--ink);
  margin: 18px 0 8px; font-size: 0.92rem;
}
.ai-explain-loading {
  display: flex; align-items: center; gap: 16px;
  color: var(--ink-tertiary); font-size: 0.86rem;
}
.ai-explain-loading .dots {
  display: inline-flex; gap: 5px;
}
.ai-explain-loading .dots span {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent-vivid);
  animation: aiDot 1.4s ease-in-out infinite;
}
.ai-explain-loading .dots span:nth-child(2) { animation-delay: 0.2s; }
.ai-explain-loading .dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes aiDot {
  0%, 80%, 100% { opacity: 0.15; transform: scale(0.7); }
  40% { opacity: 1; transform: scale(1.3); }
}
.ai-explain-error {
  font-size: 0.84rem;
  color: var(--caution); background: var(--caution-dim);
  border: 1px solid var(--caution-border);
  padding: 10px 14px; border-radius: var(--radius-sm);
  margin-top: 10px;
}
.ai-explain-footer {
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid rgba(255,255,255,0.04);
  font-size: 0.72rem;
  color: var(--ink-faint);
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ═══════════════════════════════════════════════════════════
   RESPONSIVE
   ═══════════════════════════════════════════════════════════ */
@media (max-width: 960px) {
  .app { grid-template-columns: 1fr; }
  .side {
    position: static; height: auto;
    border-right: 0; border-bottom: 1px solid var(--glass-border);
    padding: 28px 24px;
  }
  .main { padding: 32px 24px 64px; }
}
@media (max-width: 640px) {
  .scores li { grid-template-columns: 1fr 48px; }
  .scores .bar { grid-column: 1 / 2; grid-row: 2; }
  .scores .val { grid-column: 2; grid-row: 1 / 3; }
  dl.facts { grid-template-columns: 1fr; gap: 4px; }
  dl.facts dd { margin-bottom: 14px; }
  .verdict h2 { font-size: clamp(1.8rem, 6vw, 2.8rem); }
  .empty h2 { font-size: clamp(1.8rem, 6vw, 2.6rem); }
}
@media (prefers-reduced-motion: reduce) {
  .track i, .status.loading .dot, .lens::before { animation: none; }
  .lens, .go, .scores li, .detail, .group { transition: none; }
  .ambient .orb { animation: none; }
  .empty, .busy, .error, .verdict, .sec { animation: none; }
}
</style>
</head>
<body>
<div class="ambient" aria-hidden="true">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="noise"></div>
</div>

<div class="app">
  <aside class="side">
    <header>
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="12" cy="12" r="1" fill="#fff"/>
          </svg>
        </div>
        <div>
          <h1>EyeTracker</h1>
          <span class="brand-tag">AI Retinal Screening</span>
        </div>
      </div>
      <p class="lede" style="margin-top:16px;">Upload a retinal fundus photo. The model screens it for eight conditions and explains what it found.</p>
      <p class="status loading" id="status" role="status" style="margin-top:14px;"><span class="dot"></span><span id="statusText">Checking the model…</span></p>
    </header>

    <section class="group" aria-labelledby="photoHead">
      <h2 id="photoHead">Photo</h2>
      <div class="seg" role="group" aria-label="How many images">
        <button type="button" id="modeSingle" aria-pressed="true">One image</button>
        <button type="button" id="modeBoth" aria-pressed="false">Both eyes</button>
      </div>

      <div class="slots" id="slots">
        <div class="slot" id="slot-image">
          <label class="drop">
            <input class="sr" type="file" accept="image/*">
            <span class="lens"><img alt=""><span class="hint">Drop a photo or click to choose</span></span>
            <span class="slot-name">Fundus image</span>
            <span class="file">No file chosen</span>
          </label>
          <button type="button" class="linkbtn remove" hidden>Remove</button>
        </div>
        <div class="slot" id="slot-left" hidden>
          <label class="drop">
            <input class="sr" type="file" accept="image/*">
            <span class="lens"><img alt=""><span class="hint">Left eye</span></span>
            <span class="slot-name">Left eye</span>
            <span class="file">No file chosen</span>
          </label>
          <button type="button" class="linkbtn remove" hidden>Remove</button>
        </div>
        <div class="slot" id="slot-right" hidden>
          <label class="drop">
            <input class="sr" type="file" accept="image/*">
            <span class="lens"><img alt=""><span class="hint">Right eye</span></span>
            <span class="slot-name">Right eye</span>
            <span class="file">No file chosen</span>
          </label>
          <button type="button" class="linkbtn remove" hidden>Remove</button>
        </div>
      </div>
      <p class="note-side" id="sideNote" role="alert"></p>
    </section>

    <section class="group" id="samplesBox" hidden>
      <p class="samples-lead">Or try a sample image from your project folder.</p>
      <div class="samples" id="samples"></div>
    </section>

    <section class="group opts" aria-label="Options">
      <label class="opt"><input type="checkbox" id="wantHeat" checked>
        <span>Show which regions drove the result<small>Takes longer, especially on a CPU.</small></span></label>
      <label class="opt"><input type="checkbox" id="fast">
        <span>Faster, slightly less accurate<small>Skips test-time augmentation.</small></span></label>
    </section>

    <div>
      <button type="button" class="go" id="go" disabled>Analyze image</button>
      <p class="go-hint" id="goHint"></p>
    </div>
  </aside>

  <main class="main" id="out" aria-live="polite"></main>
</div>

<script>
(() => {
  "use strict";
  const $ = (sel, root = document) => root.querySelector(sel);

  function el(tag, attrs = {}, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) {
      if (kid == null || kid === false) continue;
      n.append(kid.nodeType ? kid : document.createTextNode(kid));
    }
    return n;
  }
  const pct = p => (p < 0.005 ? "<1%" : Math.round(p * 100) + "%");

  /* ---------------- state ---------------- */
  let mode = "single";
  let runId = 0;
  const files = { image: null, left: null, right: null };
  const out = $("#out");
  const go = $("#go");

  /* ---------------- model status ---------------- */
  const statusEl = $("#status"), statusText = $("#statusText");
  async function pollHealth() {
    try {
      const h = await (await fetch("/api/health")).json();
      if (h.ready) {
        statusEl.className = "status ready";
        statusText.textContent = `Model ready (${h.device}).`;
        return;
      }
      if (h.error) {
        statusEl.className = "status error";
        statusText.textContent = `The model failed to load: ${h.error}`;
        return;
      }
      statusEl.className = "status loading";
      statusText.textContent = "Loading the model. The first start downloads about 300 MB.";
    } catch {
      statusEl.className = "status error";
      statusText.textContent = "Can't reach the server. Start it with python app.py.";
    }
    setTimeout(pollHealth, 2000);
  }
  pollHealth();

  /* ---------------- upload slots ---------------- */
  const slots = {};
  for (const key of ["image", "left", "right"]) {
    const root = $("#slot-" + key);
    const s = slots[key] = {
      root, drop: $(".drop", root), input: $("input", root), img: $("img", root),
      name: $(".file", root), remove: $(".remove", root), url: null,
    };
    s.input.addEventListener("change", () => { if (s.input.files[0]) setFile(key, s.input.files[0]); });
    for (const ev of ["dragenter", "dragover"]) s.drop.addEventListener(ev, e => { e.preventDefault(); s.drop.classList.add("over"); });
    for (const ev of ["dragleave", "drop"]) s.drop.addEventListener(ev, e => { e.preventDefault(); s.drop.classList.remove("over"); });
    s.drop.addEventListener("drop", e => { const f = e.dataTransfer.files[0]; if (f) setFile(key, f); });
    s.img.addEventListener("error", () => s.drop.classList.remove("filled"));
    s.remove.addEventListener("click", () => clearFile(key));
  }

  function setFile(key, file) {
    const note = $("#sideNote");
    note.textContent = "";
    if (!/^image\//.test(file.type) && !/\.(png|jpe?g|tiff?|bmp|webp)$/i.test(file.name)) {
      note.textContent = "Choose an image file (JPG, PNG or TIFF).";
      return;
    }
    const s = slots[key];
    if (s.url) URL.revokeObjectURL(s.url);
    files[key] = file;
    s.url = URL.createObjectURL(file);
    s.img.src = s.url;
    s.drop.classList.add("filled");
    s.name.textContent = file.name;
    s.remove.hidden = false;
    updateGo();
  }

  function clearFile(key) {
    const s = slots[key];
    if (s.url) URL.revokeObjectURL(s.url);
    s.url = null; files[key] = null;
    s.input.value = ""; s.img.removeAttribute("src");
    s.drop.classList.remove("filled");
    s.name.textContent = "No file chosen";
    s.remove.hidden = true;
    updateGo();
  }

  function setMode(m) {
    mode = m;
    $("#modeSingle").setAttribute("aria-pressed", String(m === "single"));
    $("#modeBoth").setAttribute("aria-pressed", String(m === "both"));
    $("#slots").classList.toggle("both", m === "both");
    slots.image.root.hidden = m !== "single";
    slots.left.root.hidden = slots.right.root.hidden = m !== "both";
    updateGo();
  }
  $("#modeSingle").addEventListener("click", () => setMode("single"));
  $("#modeBoth").addEventListener("click", () => setMode("both"));

  function updateGo() {
    const hint = $("#goHint");
    const ok = mode === "single" ? !!files.image : !!(files.left || files.right);
    go.disabled = !ok || go.dataset.busy === "1";
    if (mode === "both" && (files.left ? !files.right : !!files.right)) hint.textContent = "With one eye only, the model uses that photo for both. Add the other eye for better accuracy.";
    else if (!ok) hint.textContent = "Add a photo to enable analysis.";
    else hint.textContent = "";
  }

  /* ---------------- samples ---------------- */
  (async function loadSamples() {
    try {
      const list = await (await fetch("/api/samples")).json();
      if (!list.length) return;
      const box = $("#samples");
      for (const s of list) {
        box.append(el("button", { type: "button", text: s.label, onclick: async () => {
          try {
            const blob = await (await fetch("/samples/" + encodeURIComponent(s.name))).blob();
            setMode("single");
            setFile("image", new File([blob], s.name, { type: blob.type || "image/png" }));
          } catch { $("#sideNote").textContent = "Couldn't load that sample."; }
        } }));
      }
      $("#samplesBox").hidden = false;
    } catch { /* samples are optional */ }
  })();

  /* ---------------- report rendering ---------------- */
  function timer(node, label) {
    const t0 = Date.now();
    const tick = () => { node.textContent = `${label} ${Math.floor((Date.now() - t0) / 1000)} s elapsed.`; };
    tick();
    const id = setInterval(tick, 500);
    return () => clearInterval(id);
  }

  function showEmpty() {
    out.replaceChildren(el("section", { class: "empty" },
      el("h2", { text: "Upload a fundus photo to see the result here." }),
      el("p", { text: "You get a screening verdict, a score for each condition, a plain-language explanation of anything flagged, and a map of the retinal regions that drove the result." }),
      el("ul", {},
        el("li", { text: "Use a retinal fundus photo, not a photo of the outside of the eye." }),
        el("li", { text: "Two photos (left and right eye) give the most accurate result." }),
        el("li", { text: "This is a research tool and does not replace an eye exam." }))));
  }
  showEmpty();

  let stopTimer = () => {};
  function showBusy() {
    stopTimer();
    const line = el("p", { class: "elapsed" });
    out.replaceChildren(el("section", { class: "busy" },
      el("h2", { text: "Analyzing the photo…" }),
      el("p", { text: "The model is reading the image. On a CPU this can take a few seconds to half a minute." }),
      line, el("div", { class: "track", "aria-hidden": "true" }, el("i"))));
    stopTimer = timer(line, "Running the model.");
  }

  function showError(msg) {
    stopTimer();
    out.replaceChildren(el("section", { class: "error", role: "alert" },
      el("h2", { text: "The analysis didn't finish" }), el("p", { text: msg })));
  }

  function renderResult(data) {
    stopTimer();
    const titles = { disease: "Possible disease detected", normal: "No disease detected", inconclusive: "Inconclusive result" };
    const top = data.classes[0];
    const flaggedNames = data.classes.filter(c => c.flagged && c.code !== "N").map(c => c.name);
    const sub = data.verdict === "disease" ? flaggedNames.join(", ")
      : data.verdict === "normal" ? "The model found nothing it associates with the conditions it knows."
      : `No condition passed its threshold. The highest score was ${top.name} at ${pct(top.prob)}.`;

    const parts = [];
    parts.push(el("section", { class: `verdict v-${data.verdict}` },
      el("h2", { text: titles[data.verdict] }),
      el("p", { class: "sub", text: sub }),
      el("p", { class: "meta", text: `Analyzed in ${data.seconds.toFixed(1)} seconds on ${data.device}.` })));
    if (data.single) parts.push(el("p", { class: "caveat", text: "You gave one image, so the model used it for both eyes. Results can be less accurate than with a photo of each eye." }));
    if (data.conflict) parts.push(el("p", { class: "caveat", text: "The model also flagged Normal, so its answer is mixed. Treat this result with extra caution." }));

    const list = el("ul", { class: "scores" });
    for (const c of data.classes) {
      list.append(el("li", { class: c.flagged ? "flag" : "" },
        el("span", { class: "nm" }, c.name, c.flagged ? el("span", { class: "tag", text: "Flagged" }) : null),
        el("span", { class: "bar", role: "img", "aria-label": `${c.name}: ${pct(c.prob)}` }, el("i", { style: `width:${Math.max(c.prob * 100, 1)}%` })),
        el("span", { class: "val", text: pct(c.prob) })));
    }
    parts.push(el("section", { class: "sec" },
      el("h2", { text: "Score for each condition" }),
      el("p", { class: "lead", text: "Scores are independent, so they don't add up to 100%. A condition is flagged when its score passes the threshold the model learned for that condition." }),
      list));

    if (data.details.length) {
      const sec = el("section", { class: "sec" },
        el("h2", { text: data.verdict === "disease" ? "What was flagged" : "About this result" }));
      for (const d of data.details) {
        const detailCard = el("article", { class: "detail" },
          el("h3", { text: d.name }),
          el("div", { class: "rel" },
            el("span", { class: "relbar", "aria-hidden": "true" }, el("i", { style: `width:${Math.round((d.f1 || 0) * 100)}%` })),
            el("span", { text: `Model reliability for this condition: F1 ${(d.f1 || 0).toFixed(2)} on its own validation data` })),
          d.unreliable ? el("p", { class: "weak", text: "The model is weak on this condition, so treat the flag as a faint signal and not a finding." }) : null,
          el("dl", { class: "facts" },
            el("dt", { text: "What it is" }), el("dd", { text: d.what }),
            el("dt", { text: "Typical signs" }), el("dd", { text: d.signs }),
            el("dt", { text: "Why it matters" }), el("dd", { text: d.risk }),
            el("dt", { text: "Suggested next step" }), el("dd", { text: d.next })));

        /* AI Explanation card for each flagged disease */
        const aiBox = el("div", { class: "ai-explain" },
          el("div", { class: "ai-explain-header" },
            el("div", { class: "ai-explain-icon", text: "✨" }),
            el("h3", { text: "Explanation" }),
          ),
          el("div", { class: "ai-explain-loading" },
            el("div", { class: "dots" }, el("span"), el("span"), el("span")),
            el("span", { text: "Generating explanation…" })),
        );
        detailCard.append(aiBox);
        sec.append(detailCard);

        /* Fire off the LLM explanation request */
        loadLlmExplanation(data.token, d.code, aiBox, runId);
      }
      parts.push(sec);
    }

    let heatBox = null;
    if (data.explain_code && $("#wantHeat").checked) {
      heatBox = el("section", { class: "sec" });
      parts.push(heatBox);
    }
    parts.push(el("p", { class: "disclaimer", text: "This is a research model that has not been clinically validated. Its output is not a diagnosis. See an eye doctor to confirm any finding." }));
    out.replaceChildren(...parts);
    window.scrollTo({ top: 0, behavior: "smooth" });
    return heatBox;
  }

  function compare(eye) {
    const wrap = el("div", { class: "compare", style: "--pos:50%" });
    wrap.append(
      el("img", { src: eye.original, alt: `${eye.eye} eye, original photo` }),
      el("img", { class: "over", src: eye.overlay, alt: `${eye.eye} eye with the region map on top` }),
      el("span", { class: "handle", "aria-hidden": "true" }));
    const range = el("input", { type: "range", min: "0", max: "100", value: "50", "aria-label": "Slide to compare the original photo with the region map" });
    const set = v => { wrap.style.setProperty("--pos", v + "%"); range.value = v; };
    range.addEventListener("input", () => set(range.value));
    const fromPointer = e => {
      const r = wrap.getBoundingClientRect();
      set(Math.min(100, Math.max(0, ((e.clientX - r.left) / r.width) * 100)));
    };
    wrap.addEventListener("pointerdown", e => { wrap.setPointerCapture(e.pointerId); fromPointer(e); wrap.onpointermove = fromPointer; });
    for (const ev of ["pointerup", "pointercancel"]) wrap.addEventListener(ev, () => { wrap.onpointermove = null; });
    return el("div", {}, wrap, el("div", { class: "slider" }, el("span", { text: "Original" }), range, el("span", { text: "Region map" })));
  }

  async function loadHeatmap(data, id, box) {
    const line = el("p", { class: "pending" });
    box.replaceChildren(el("h2", { text: "Regions that drove the result" }), line);
    const stop = timer(line, "Hiding parts of the image one at a time to see what matters. This runs the model many times.");
    try {
      const r = await fetch("/api/explain", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: data.token, code: data.explain_code, grid: 6 }),
      });
      const j = await r.json().catch(() => ({ error: "The server sent an unreadable reply." }));
      if (!r.ok) throw new Error(j.error || "Could not build the region map.");
      if (id !== runId) return;
      stop();
      const holder = el("div");
      const show = i => holder.replaceChildren(compare(j.eyes[i]));
      const head = [el("h2", { text: "Regions that drove the result" }),
        el("p", { class: "lead", text: `Shown for ${j.name}, the strongest flagged condition.` })];
      let tabs = null;
      if (j.eyes.length > 1) {
        tabs = el("div", { class: "eyes", role: "group", "aria-label": "Eye" });
        j.eyes.forEach((e, i) => tabs.append(el("button", { type: "button", "aria-pressed": String(i === 0), text: e.eye === "left" ? "Left eye" : "Right eye",
          onclick: () => { [...tabs.children].forEach((b, k) => b.setAttribute("aria-pressed", String(k === i))); show(i); } })));
      }
      show(0);
      box.replaceChildren(...head, tabs, holder,
        el("p", { class: "cap", text: "Warmer colors mark areas where hiding the image lowered the model's confidence the most. This shows where the model looked, not a clinical finding." }));
    } catch (e) {
      stop();
      if (id !== runId) return;
      box.replaceChildren(el("h2", { text: "Regions that drove the result" }),
        el("p", { class: "pending", text: (e && e.name === "TypeError") ? "Can't reach the server. Check that python app.py is still running." : e.message }));
    }
  }

  /* ---------- simple markdown→HTML ---------- */
  function mdToHtml(md) {
    let html = md
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      // bold
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      // italic
      .replace(/(?<!\*)\*([^*]+?)\*(?!\*)/g, "<em>$1</em>")
      // inline code
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      // headings (### → h4, ## → h3, # → h2)
      .replace(/^### (.+)$/gm, "<h4>$1</h4>")
      .replace(/^## (.+)$/gm, "<h3>$1</h3>")
      .replace(/^# (.+)$/gm, "<h2>$1</h2>");

    // blockquotes
    html = html.replace(/(^&gt; .+(?:\n&gt; .+)*)/gm, m => {
      const inner = m.replace(/^&gt; /gm, "");
      return `<blockquote>${inner}</blockquote>`;
    });

    // unordered lists (- or •)
    html = html.replace(/((?:^[\-•] .+\n?)+)/gm, m => {
      const items = m.trim().split(/\n/).map(l => `<li>${l.replace(/^[\-•]\s*/, "")}</li>`).join("");
      return `<ul>${items}</ul>`;
    });

    // paragraphs: split by double newline
    html = html
      .split(/\n{2,}/)
      .map(block => {
        block = block.trim();
        if (!block) return "";
        if (/^<(h[2-6]|ul|ol|blockquote|li)/.test(block)) return block;
        return `<p>${block.replace(/\n/g, "<br>")}</p>`;
      })
      .join("");

    return html;
  }

  /* ---------- LLM explanation loader ---------- */
  async function loadLlmExplanation(token, code, box, id) {
    try {
      const r = await fetch("/api/llm-explain", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, code }),
      });
      const j = await r.json().catch(() => ({ error: "The server sent an unreadable reply." }));
      if (!r.ok) throw new Error(j.error || "Could not generate explanation.");
      if (id !== runId) return;

      const body = el("div", { class: "ai-explain-body" });
      body.innerHTML = mdToHtml(j.explanation);

      const footer = el("div", { class: "ai-explain-footer" },
        el("span", { text: "🤖" }),
        el("span", { text: "Generated by AI — not a clinical diagnosis" }));

      box.replaceChildren(
        el("div", { class: "ai-explain-header" },
          el("div", { class: "ai-explain-icon", text: "✨" }),
          el("h3", { text: "Explanation" }),
        ),
        body,
        j.error ? el("p", { class: "ai-explain-error", text: j.error }) : null,
        footer,
      );
    } catch (e) {
      if (id !== runId) return;
      box.replaceChildren(
        el("div", { class: "ai-explain-header" },
          el("div", { class: "ai-explain-icon", text: "✨" }),
          el("h3", { text: "Explanation" }),
        ),
        el("p", { class: "ai-explain-error",
          text: (e && e.name === "TypeError")
            ? "Can't reach the server."
            : (e.message || "Failed to generate explanation.") }),
      );
    }
  }

  /* ---------------- analyze ---------------- */
  function setBusy(b) { go.dataset.busy = b ? "1" : "0"; go.textContent = b ? "Analyzing…" : "Analyze image"; updateGo(); }

  async function analyze() {
    const id = ++runId;
    const fd = new FormData();
    if (mode === "single") fd.append("image", files.image);
    else if (files.left && files.right) { fd.append("left", files.left); fd.append("right", files.right); }
    else fd.append("image", files.left || files.right);
    fd.append("tta", $("#fast").checked ? "0" : "1");

    setBusy(true);
    showBusy();
    let data;
    try {
      const r = await fetch("/api/predict", { method: "POST", body: fd });
      data = await r.json().catch(() => ({ error: "The server sent an unreadable reply." }));
      if (!r.ok) throw new Error(data.error || "Analysis failed.");
    } catch (e) {
      if (id !== runId) return;
      showError((e && e.name === "TypeError") ? "Can't reach the server. Check that python app.py is still running, then try again." : e.message);
      setBusy(false);
      return;
    }
    if (id !== runId) return;
    const heatBox = renderResult(data);
    setBusy(false);
    if (heatBox) loadHeatmap(data, id, heatBox);
  }
  go.addEventListener("click", analyze);
  setMode("single");
})();
</script>

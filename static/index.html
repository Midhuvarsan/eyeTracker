<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EyeTracker — AI Retinal Screening</title>
<meta name="description" content="EyeTracker uses deep learning to screen retinal fundus photos for eight eye conditions. Upload a photo and get instant AI-powered analysis.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   DESIGN TOKENS
   ═══════════════════════════════════════════════════════════ */
:root {
  --bg-body: #0a0e17;
  --bg-panel: rgba(14, 19, 30, 0.82);
  --bg-panel-solid: #0e131e;
  --bg-card: rgba(22, 30, 48, 0.65);
  --bg-card-hover: rgba(30, 42, 66, 0.72);
  --glass-border: rgba(255, 255, 255, 0.06);
  --glass-border-hover: rgba(255, 255, 255, 0.12);

  --ink: #e8ecf4;
  --ink-secondary: #8b95a8;
  --ink-tertiary: #5a6478;

  --accent: #38bdf8;
  --accent-dim: rgba(56, 189, 248, 0.12);
  --accent-glow: rgba(56, 189, 248, 0.25);

  --gradient-accent: linear-gradient(135deg, #38bdf8, #818cf8);
  --gradient-accent-text: linear-gradient(135deg, #38bdf8, #a78bfa);
  --gradient-hero: linear-gradient(160deg, #0f172a 0%, #0a0e17 40%, #0d1321 100%);

  --flag: #f87171;
  --flag-dim: rgba(248, 113, 113, 0.12);
  --ok: #34d399;
  --ok-dim: rgba(52, 211, 153, 0.12);
  --caution: #fbbf24;
  --caution-dim: rgba(251, 191, 36, 0.12);

  --bar-track: rgba(255, 255, 255, 0.06);
  --bar-fill: #475569;

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;

  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.35);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.45);
  --shadow-glow: 0 0 40px rgba(56, 189, 248, 0.08);

  --transition-fast: 0.15s ease;
  --transition-normal: 0.25s ease;
  --transition-slow: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ═══════════════════════════════════════════════════════════
   RESET & BASE
   ═══════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  background: var(--bg-body);
  scroll-behavior: smooth;
}

body {
  color: var(--ink);
  background: var(--bg-body);
  font: 400 15px/1.6 'Inter', system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}

h1, h2, h3 { font-family: 'DM Serif Display', Georgia, serif; font-weight: 400; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ═══════════════════════════════════════════════════════════
   AMBIENT BACKGROUND
   ═══════════════════════════════════════════════════════════ */
.ambient {
  position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
}
.ambient::before {
  content: ''; position: absolute;
  width: 600px; height: 600px;
  top: -120px; right: -100px;
  background: radial-gradient(circle, rgba(56, 189, 248, 0.06) 0%, transparent 70%);
  animation: ambientFloat 18s ease-in-out infinite;
}
.ambient::after {
  content: ''; position: absolute;
  width: 500px; height: 500px;
  bottom: -80px; left: -80px;
  background: radial-gradient(circle, rgba(129, 140, 248, 0.05) 0%, transparent 70%);
  animation: ambientFloat 22s ease-in-out infinite reverse;
}
@keyframes ambientFloat {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(30px, -20px) scale(1.05); }
  66% { transform: translate(-20px, 15px) scale(0.95); }
}

/* ═══════════════════════════════════════════════════════════
   LAYOUT
   ═══════════════════════════════════════════════════════════ */
.app {
  position: relative; z-index: 1;
  display: grid;
  grid-template-columns: 400px 1fr;
  min-height: 100vh;
}

/* ═══════════════════════════════════════════════════════════
   LEFT PANEL (SIDEBAR)
   ═══════════════════════════════════════════════════════════ */
.side {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  padding: 32px 28px 36px;
  background: var(--bg-panel);
  backdrop-filter: blur(24px) saturate(1.2);
  -webkit-backdrop-filter: blur(24px) saturate(1.2);
  border-right: 1px solid var(--glass-border);
  display: flex; flex-direction: column; gap: 24px;
  scrollbar-width: thin;
  scrollbar-color: var(--ink-tertiary) transparent;
}
.side::-webkit-scrollbar { width: 5px; }
.side::-webkit-scrollbar-thumb { background: var(--ink-tertiary); border-radius: 4px; }

/* — Brand — */
.brand {
  display: flex; align-items: center; gap: 12px;
}
.brand-icon {
  width: 40px; height: 40px; flex: none;
  border-radius: 10px;
  background: var(--gradient-accent);
  display: grid; place-items: center;
  box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
}
.brand-icon svg { width: 22px; height: 22px; }
.brand h1 {
  font-size: 1.45rem; letter-spacing: -0.02em; line-height: 1;
}
.brand-tag {
  display: inline-block; margin-top: 2px;
  font-family: 'Inter', sans-serif;
  font-size: 0.65rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--accent);
  opacity: 0.7;
}

.lede {
  color: var(--ink-secondary);
  font-size: 0.88rem; max-width: 36ch; line-height: 1.55;
}

/* — Status Badge — */
.status {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 12px;
  background: var(--bg-card);
  border: 1px solid var(--glass-border);
  border-radius: 999px;
  font-size: 0.78rem; color: var(--ink-secondary);
  width: fit-content;
  transition: all var(--transition-normal);
}
.dot {
  width: 8px; height: 8px; border-radius: 50%; flex: none;
  background: var(--caution);
  transition: background var(--transition-normal);
}
.status.ready .dot { background: var(--ok); box-shadow: 0 0 8px rgba(52, 211, 153, 0.4); }
.status.error .dot { background: var(--flag); }
.status.loading .dot { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

/* — Section Cards — */
.group {
  background: var(--bg-card);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  padding: 20px;
  transition: border-color var(--transition-normal);
}
.group:hover { border-color: var(--glass-border-hover); }
.group h2 {
  font-size: 1.05rem; margin-bottom: 14px;
  display: flex; align-items: center; gap: 8px;
}
.group h2::before {
  content: '';
  width: 3px; height: 18px;
  background: var(--gradient-accent);
  border-radius: 2px;
  flex: none;
}

/* — Mode Switcher — */
.seg {
  display: inline-flex;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  overflow: hidden;
  margin-bottom: 16px;
}
.seg button {
  background: transparent; border: 0;
  padding: 7px 16px; font-size: 0.82rem; font-weight: 500;
  color: var(--ink-secondary);
  transition: all var(--transition-fast);
}
.seg button + button { border-left: 1px solid var(--glass-border); }
.seg button:hover { color: var(--ink); background: rgba(255,255,255,0.04); }
.seg button[aria-pressed="true"] {
  background: var(--gradient-accent); color: #0a0e17; font-weight: 600;
}

/* — Upload Slots — */
.slots { display: flex; gap: 16px; flex-wrap: wrap; }
.slot { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; max-width: 100%; }
[hidden] { display: none !important; }
.drop { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; cursor: pointer; max-width: 100%; }

.lens {
  --size: 160px;
  width: var(--size); height: var(--size); border-radius: 50%;
  border: 2px dashed var(--ink-tertiary);
  display: grid; place-items: center; text-align: center;
  color: var(--ink-tertiary); font-size: 0.82rem; padding: 18px;
  background: rgba(255,255,255,0.02);
  overflow: hidden; position: relative;
  transition: all var(--transition-normal);
}
.lens::before {
  content: ''; position: absolute; inset: -4px;
  border-radius: 50%;
  border: 2px solid transparent;
  background: conic-gradient(from 0deg, transparent, var(--accent), transparent) border-box;
  -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  opacity: 0;
  transition: opacity var(--transition-normal);
  animation: scanSpin 3s linear infinite;
}
@keyframes scanSpin { to { transform: rotate(360deg); } }
.drop:hover .lens::before { opacity: 0.6; }
.drop:hover .lens { border-color: var(--accent); background: var(--accent-dim); }
.slots.both .lens { --size: 120px; }
.lens img { display: none; position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

.drop.filled .lens {
  border: 2px solid var(--accent);
  background: #000;
  box-shadow: 0 0 24px rgba(56, 189, 248, 0.15);
}
.drop.filled .lens::before { opacity: 0; }
.drop.filled .lens img { display: block; }
.drop.filled .hint { display: none; }
.drop:focus-within .lens { outline: 2px solid var(--accent); outline-offset: 3px; }

.slot-name { font-weight: 600; font-size: 0.88rem; color: var(--ink); }
.file {
  font-size: 0.75rem; color: var(--ink-tertiary);
  max-width: 18ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.linkbtn {
  background: none; border: 0; padding: 0;
  color: var(--accent); text-decoration: none; cursor: pointer;
  font-size: 0.8rem; font-weight: 500;
  transition: opacity var(--transition-fast);
}
.linkbtn:hover { opacity: 0.8; text-decoration: underline; }
.note-side { font-size: 0.82rem; color: var(--flag); min-height: 1.2em; margin-top: 8px; }

/* — Sample Chips — */
.samples { display: flex; flex-wrap: wrap; gap: 8px; }
.samples button {
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--glass-border);
  border-radius: 999px;
  padding: 5px 14px; font-size: 0.78rem; font-weight: 500;
  color: var(--ink-secondary);
  transition: all var(--transition-fast);
}
.samples button:hover {
  border-color: var(--accent); color: var(--accent);
  background: var(--accent-dim);
}
.samples-lead { font-size: 0.82rem; color: var(--ink-tertiary); margin-bottom: 10px; }

/* — Options — */
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; gap: 10px; align-items: flex-start;
  font-size: 0.86rem; cursor: pointer; color: var(--ink-secondary);
}
.opt input { margin-top: 4px; accent-color: var(--accent); }
.opt small { display: block; color: var(--ink-tertiary); font-size: 0.75rem; margin-top: 2px; }

/* — Analyze Button — */
.go {
  position: relative; overflow: hidden;
  background: var(--gradient-accent);
  color: #0a0e17; border: 0;
  border-radius: var(--radius-md);
  padding: 14px 20px; font-weight: 700; font-size: 0.95rem;
  width: 100%; letter-spacing: 0.01em;
  box-shadow: 0 4px 20px rgba(56, 189, 248, 0.2);
  transition: all var(--transition-normal);
}
.go::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
  transform: translateX(-100%);
  transition: none;
}
.go:hover:not(:disabled) {
  box-shadow: 0 6px 28px rgba(56, 189, 248, 0.35);
  transform: translateY(-1px);
}
.go:hover:not(:disabled)::before {
  animation: btnShimmer 0.7s ease;
}
@keyframes btnShimmer { to { transform: translateX(100%); } }
.go:active:not(:disabled) { transform: translateY(0); }
.go:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }
.go-hint {
  font-size: 0.78rem; color: var(--ink-tertiary);
  margin-top: 8px; min-height: 1.2em;
}

/* ═══════════════════════════════════════════════════════════
   RIGHT PANEL (MAIN CONTENT)
   ═══════════════════════════════════════════════════════════ */
.main {
  padding: 44px clamp(24px, 4vw, 64px) 72px;
  max-width: 960px;
}

/* — Empty State — */
.empty { animation: fadeUp 0.5s ease; }
.empty h2 {
  font-size: clamp(2rem, 3.8vw, 3rem); line-height: 1.1;
  max-width: 16ch; letter-spacing: -0.02em;
  background: var(--gradient-accent-text);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.empty p { margin-top: 16px; color: var(--ink-secondary); max-width: 52ch; font-size: 0.92rem; }
.empty ul {
  margin: 22px 0 0; padding-left: 1.2em;
  color: var(--ink-tertiary); max-width: 52ch; font-size: 0.88rem;
}
.empty li + li { margin-top: 8px; }
.empty li::marker { color: var(--accent); }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* — Busy / Loading State — */
.busy { animation: fadeUp 0.4s ease; }
.busy h2 {
  font-size: 1.6rem;
  background: var(--gradient-accent-text);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.busy p { color: var(--ink-secondary); margin-top: 8px; max-width: 52ch; font-size: 0.9rem; }
.track {
  height: 4px;
  background: var(--bar-track);
  margin-top: 24px; max-width: 420px;
  overflow: hidden; border-radius: 2px;
}
.track i {
  display: block; height: 100%; width: 35%;
  background: var(--gradient-accent);
  border-radius: 2px;
  animation: slide 1.6s ease-in-out infinite;
}
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
.elapsed { font-size: 0.82rem; color: var(--ink-tertiary); margin-top: 10px; }

/* — Error State — */
.error {
  animation: fadeUp 0.4s ease;
  border-left: 4px solid var(--flag);
  padding: 4px 0 4px 18px;
  max-width: 60ch;
}
.error h2 { font-size: 1.35rem; color: var(--flag); }
.error p { margin-top: 6px; color: var(--ink-secondary); font-size: 0.9rem; }

/* — Verdict Banner — */
.verdict {
  animation: fadeUp 0.5s ease;
  border-left: 5px solid var(--bar-fill);
  padding: 6px 0 6px 24px;
}
.verdict h2 {
  font-size: clamp(2rem, 4.4vw, 3.2rem);
  line-height: 1.06; letter-spacing: -0.015em;
}
.verdict .sub { margin-top: 10px; font-size: 1.1rem; color: var(--ink-secondary); max-width: 40ch; }
.verdict .meta {
  margin-top: 10px; font-size: 0.82rem; color: var(--ink-tertiary);
  display: flex; align-items: center; gap: 6px;
}
.verdict .meta::before {
  content: '⚡'; font-size: 0.9rem;
}

.v-disease { border-color: var(--flag); }
.v-disease h2 { color: var(--flag); }
.v-normal { border-color: var(--ok); }
.v-normal h2 { color: var(--ok); }
.v-inconclusive { border-color: var(--caution); }
.v-inconclusive h2 { color: var(--caution); }

.caveat {
  margin-top: 18px;
  border-left: 3px solid var(--caution);
  background: var(--caution-dim);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  padding: 12px 16px;
  font-size: 0.88rem; color: var(--ink-secondary);
  max-width: 62ch;
}

/* — Section Dividers — */
.sec {
  margin-top: 44px; padding-top: 28px;
  border-top: 1px solid var(--glass-border);
  animation: fadeUp 0.5s ease;
}
.sec > h2 {
  font-size: 1.45rem;
  display: flex; align-items: center; gap: 10px;
}
.sec > h2::before {
  content: '';
  width: 4px; height: 22px;
  background: var(--gradient-accent);
  border-radius: 2px;
}
.sec > .lead { margin-top: 8px; color: var(--ink-tertiary); font-size: 0.88rem; max-width: 62ch; }

/* — Scores List — */
.scores { list-style: none; margin: 22px 0 0; padding: 0; display: grid; gap: 10px; }
.scores li {
  display: grid; grid-template-columns: 240px 1fr 50px; gap: 14px; align-items: center;
  padding: 8px 12px; border-radius: var(--radius-sm);
  background: var(--bg-card);
  border: 1px solid var(--glass-border);
  transition: background var(--transition-fast), border-color var(--transition-fast);
}
.scores li:hover { background: var(--bg-card-hover); border-color: var(--glass-border-hover); }
.scores .nm { font-size: 0.9rem; font-family: 'Inter', sans-serif; font-weight: 400; }
.scores li.flag .nm { font-weight: 600; color: var(--ink); }
.tag {
  margin-left: 8px; font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--flag); background: var(--flag-dim);
  border: 1px solid rgba(248,113,113,0.25);
  border-radius: 4px; padding: 1px 6px;
}
.bar {
  height: 6px; background: var(--bar-track); border-radius: 3px; overflow: hidden;
}
.bar i {
  display: block; height: 100%;
  background: var(--gradient-accent);
  border-radius: 3px;
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}
.scores li.flag .bar i { background: linear-gradient(90deg, var(--flag), #fb923c); }
.val {
  text-align: right; font-variant-numeric: tabular-nums;
  font-size: 0.88rem; color: var(--ink-secondary); font-weight: 500;
}

/* — Detail Cards — */
.detail {
  background: var(--bg-card);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  padding: 22px;
  margin-top: 20px;
  transition: border-color var(--transition-normal);
}
.detail:hover { border-color: var(--glass-border-hover); }
.detail + .detail { margin-top: 16px; }
.detail h3 {
  font-size: 1.25rem; margin-top: 0;
  color: var(--ink);
}
.rel {
  display: flex; align-items: center; gap: 12px;
  margin-top: 10px; font-size: 0.82rem; color: var(--ink-tertiary);
}
.relbar {
  width: 90px; height: 5px;
  background: var(--bar-track); border-radius: 3px; overflow: hidden; flex: none;
}
.relbar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.weak {
  margin-top: 10px; font-size: 0.85rem;
  color: var(--caution); background: var(--caution-dim);
  padding: 8px 12px; border-radius: var(--radius-sm);
  max-width: 62ch;
}
dl.facts {
  margin: 18px 0 0; display: grid;
  grid-template-columns: 10rem 1fr; gap: 10px 20px; max-width: 76ch;
}
dl.facts dt {
  font-weight: 600; font-size: 0.88rem;
  color: var(--ink-secondary);
}
dl.facts dd { margin: 0; font-size: 0.88rem; color: var(--ink-tertiary); line-height: 1.55; }

/* — Eye Tabs — */
.eyes {
  display: inline-flex;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  overflow: hidden;
  margin: 18px 0 14px;
}
.eyes button {
  background: transparent; border: 0;
  padding: 7px 16px; font-size: 0.82rem; font-weight: 500;
  color: var(--ink-secondary);
  transition: all var(--transition-fast);
}
.eyes button + button { border-left: 1px solid var(--glass-border); }
.eyes button[aria-pressed="true"] {
  background: var(--gradient-accent); color: #0a0e17; font-weight: 600;
}

/* — Compare Slider — */
.compare {
  position: relative; width: 100%; max-width: 520px;
  margin-top: 18px; touch-action: pan-y; user-select: none; cursor: ew-resize;
  background: #000; border-radius: var(--radius-md); overflow: hidden;
  box-shadow: var(--shadow-lg);
}
.eyes + .compare { margin-top: 0; }
.compare img { display: block; width: 100%; height: auto; pointer-events: none; }
.compare .over { position: absolute; inset: 0; clip-path: inset(0 0 0 var(--pos)); }
.compare .handle {
  position: absolute; top: 0; bottom: 0; left: var(--pos); width: 2px; margin-left: -1px;
  background: #fff; box-shadow: 0 0 8px rgba(0,0,0,0.5);
}
.compare .handle::after {
  content: ''; position: absolute; top: 50%; left: 50%;
  width: 24px; height: 24px; margin: -12px 0 0 -12px;
  border-radius: 50%; background: #fff;
  box-shadow: 0 0 0 2px rgba(0,0,0,0.2), 0 2px 8px rgba(0,0,0,0.3);
}
.slider {
  display: flex; align-items: center; gap: 12px;
  margin-top: 12px; max-width: 520px;
  font-size: 0.82rem; color: var(--ink-tertiary);
}
.slider input { flex: 1; accent-color: var(--accent); }
.cap { margin-top: 14px; font-size: 0.85rem; color: var(--ink-tertiary); max-width: 62ch; }
.pending { margin-top: 16px; color: var(--ink-tertiary); max-width: 62ch; font-size: 0.88rem; }

/* — Disclaimer — */
.disclaimer {
  margin-top: 48px; padding-top: 20px;
  border-top: 1px solid var(--glass-border);
  font-size: 0.82rem; color: var(--ink-tertiary); max-width: 70ch;
  opacity: 0.7;
}

/* ═══════════════════════════════════════════════════════════
   RESPONSIVE
   ═══════════════════════════════════════════════════════════ */
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .side {
    position: static; height: auto;
    border-right: 0; border-bottom: 1px solid var(--glass-border);
    padding: 24px 20px;
  }
  .main { padding: 28px 20px 56px; }
}
@media (max-width: 640px) {
  .scores li { grid-template-columns: 1fr 44px; }
  .scores .bar { grid-column: 1 / 2; grid-row: 2; }
  .scores .val { grid-column: 2; grid-row: 1 / 3; }
  dl.facts { grid-template-columns: 1fr; gap: 2px; }
  dl.facts dd { margin-bottom: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .track i, .status.loading .dot, .lens::before { animation: none; }
  .lens, .go, .scores li, .detail, .group { transition: none; }
  .ambient::before, .ambient::after { animation: none; }
  .empty, .busy, .error, .verdict, .sec { animation: none; }
}
</style>
</head>
<body>
<div class="ambient" aria-hidden="true"></div>

<div class="app">
  <aside class="side">
    <header>
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#0a0e17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="12" cy="12" r="1" fill="#0a0e17"/>
          </svg>
        </div>
        <div>
          <h1>EyeTracker</h1>
          <span class="brand-tag">AI Retinal Screening</span>
        </div>
      </div>
      <p class="lede" style="margin-top:14px;">Upload a retinal fundus photo. The model screens it for eight conditions and explains what it found.</p>
      <p class="status loading" id="status" role="status" style="margin-top:12px;"><span class="dot"></span><span id="statusText">Checking the model…</span></p>
    </header>

    <section class="group" aria-labelledby="photoHead">
      <h2 id="photoHead">Photo</h2>
      <div class="seg" role="group" aria-label="How many images">
        <button type="button" id="modeSingle" aria-pressed="true">One image</button>
        <button type="button" id="modeBoth" aria-pressed="false">Both eyes</button>
      </div>

      <div class="slots" id="slots">
        <div class="slot" id="slot-image">
          <label class="drop">
            <input class="sr" type="file" accept="image/*">
            <span class="lens"><img alt=""><span class="hint">Drop a photo or click to choose</span></span>
            <span class="slot-name">Fundus image</span>
            <span class="file">No file chosen</span>
          </label>
          <button type="button" class="linkbtn remove" hidden>Remove</button>
        </div>
        <div class="slot" id="slot-left" hidden>
          <label class="drop">
            <input class="sr" type="file" accept="image/*">
            <span class="lens"><img alt=""><span class="hint">Left eye</span></span>
            <span class="slot-name">Left eye</span>
            <span class="file">No file chosen</span>
          </label>
          <button type="button" class="linkbtn remove" hidden>Remove</button>
        </div>
        <div class="slot" id="slot-right" hidden>
          <label class="drop">
            <input class="sr" type="file" accept="image/*">
            <span class="lens"><img alt=""><span class="hint">Right eye</span></span>
            <span class="slot-name">Right eye</span>
            <span class="file">No file chosen</span>
          </label>
          <button type="button" class="linkbtn remove" hidden>Remove</button>
        </div>
      </div>
      <p class="note-side" id="sideNote" role="alert"></p>
    </section>

    <section class="group" id="samplesBox" hidden>
      <p class="samples-lead">Or try a sample image from your project folder.</p>
      <div class="samples" id="samples"></div>
    </section>

    <section class="group opts" aria-label="Options">
      <label class="opt"><input type="checkbox" id="wantHeat" checked>
        <span>Show which regions drove the result<small>Takes longer, especially on a CPU.</small></span></label>
      <label class="opt"><input type="checkbox" id="fast">
        <span>Faster, slightly less accurate<small>Skips test-time augmentation.</small></span></label>
    </section>

    <div>
      <button type="button" class="go" id="go" disabled>Analyze image</button>
      <p class="go-hint" id="goHint"></p>
    </div>
  </aside>

  <main class="main" id="out" aria-live="polite"></main>
</div>

<script>
(() => {
  "use strict";
  const $ = (sel, root = document) => root.querySelector(sel);

  function el(tag, attrs = {}, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) {
      if (kid == null || kid === false) continue;
      n.append(kid.nodeType ? kid : document.createTextNode(kid));
    }
    return n;
  }
  const pct = p => (p < 0.005 ? "<1%" : Math.round(p * 100) + "%");

  /* ---------------- state ---------------- */
  let mode = "single";
  let runId = 0;
  const files = { image: null, left: null, right: null };
  const out = $("#out");
  const go = $("#go");

  /* ---------------- model status ---------------- */
  const statusEl = $("#status"), statusText = $("#statusText");
  async function pollHealth() {
    try {
      const h = await (await fetch("/api/health")).json();
      if (h.ready) {
        statusEl.className = "status ready";
        statusText.textContent = `Model ready (${h.device}).`;
        return;
      }
      if (h.error) {
        statusEl.className = "status error";
        statusText.textContent = `The model failed to load: ${h.error}`;
        return;
      }
      statusEl.className = "status loading";
      statusText.textContent = "Loading the model. The first start downloads about 300 MB.";
    } catch {
      statusEl.className = "status error";
      statusText.textContent = "Can't reach the server. Start it with python app.py.";
    }
    setTimeout(pollHealth, 2000);
  }
  pollHealth();

  /* ---------------- upload slots ---------------- */
  const slots = {};
  for (const key of ["image", "left", "right"]) {
    const root = $("#slot-" + key);
    const s = slots[key] = {
      root, drop: $(".drop", root), input: $("input", root), img: $("img", root),
      name: $(".file", root), remove: $(".remove", root), url: null,
    };
    s.input.addEventListener("change", () => { if (s.input.files[0]) setFile(key, s.input.files[0]); });
    for (const ev of ["dragenter", "dragover"]) s.drop.addEventListener(ev, e => { e.preventDefault(); s.drop.classList.add("over"); });
    for (const ev of ["dragleave", "drop"]) s.drop.addEventListener(ev, e => { e.preventDefault(); s.drop.classList.remove("over"); });
    s.drop.addEventListener("drop", e => { const f = e.dataTransfer.files[0]; if (f) setFile(key, f); });
    s.img.addEventListener("error", () => s.drop.classList.remove("filled"));
    s.remove.addEventListener("click", () => clearFile(key));
  }

  function setFile(key, file) {
    const note = $("#sideNote");
    note.textContent = "";
    if (!/^image\//.test(file.type) && !/\.(png|jpe?g|tiff?|bmp|webp)$/i.test(file.name)) {
      note.textContent = "Choose an image file (JPG, PNG or TIFF).";
      return;
    }
    const s = slots[key];
    if (s.url) URL.revokeObjectURL(s.url);
    files[key] = file;
    s.url = URL.createObjectURL(file);
    s.img.src = s.url;
    s.drop.classList.add("filled");
    s.name.textContent = file.name;
    s.remove.hidden = false;
    updateGo();
  }

  function clearFile(key) {
    const s = slots[key];
    if (s.url) URL.revokeObjectURL(s.url);
    s.url = null; files[key] = null;
    s.input.value = ""; s.img.removeAttribute("src");
    s.drop.classList.remove("filled");
    s.name.textContent = "No file chosen";
    s.remove.hidden = true;
    updateGo();
  }

  function setMode(m) {
    mode = m;
    $("#modeSingle").setAttribute("aria-pressed", String(m === "single"));
    $("#modeBoth").setAttribute("aria-pressed", String(m === "both"));
    $("#slots").classList.toggle("both", m === "both");
    slots.image.root.hidden = m !== "single";
    slots.left.root.hidden = slots.right.root.hidden = m !== "both";
    updateGo();
  }
  $("#modeSingle").addEventListener("click", () => setMode("single"));
  $("#modeBoth").addEventListener("click", () => setMode("both"));

  function updateGo() {
    const hint = $("#goHint");
    const ok = mode === "single" ? !!files.image : !!(files.left || files.right);
    go.disabled = !ok || go.dataset.busy === "1";
    if (mode === "both" && (files.left ? !files.right : !!files.right)) hint.textContent = "With one eye only, the model uses that photo for both. Add the other eye for better accuracy.";
    else if (!ok) hint.textContent = "Add a photo to enable analysis.";
    else hint.textContent = "";
  }

  /* ---------------- samples ---------------- */
  (async function loadSamples() {
    try {
      const list = await (await fetch("/api/samples")).json();
      if (!list.length) return;
      const box = $("#samples");
      for (const s of list) {
        box.append(el("button", { type: "button", text: s.label, onclick: async () => {
          try {
            const blob = await (await fetch("/samples/" + encodeURIComponent(s.name))).blob();
            setMode("single");
            setFile("image", new File([blob], s.name, { type: blob.type || "image/png" }));
          } catch { $("#sideNote").textContent = "Couldn't load that sample."; }
        } }));
      }
      $("#samplesBox").hidden = false;
    } catch { /* samples are optional */ }
  })();

  /* ---------------- report rendering ---------------- */
  function timer(node, label) {
    const t0 = Date.now();
    const tick = () => { node.textContent = `${label} ${Math.floor((Date.now() - t0) / 1000)} s elapsed.`; };
    tick();
    const id = setInterval(tick, 500);
    return () => clearInterval(id);
  }

  function showEmpty() {
    out.replaceChildren(el("section", { class: "empty" },
      el("h2", { text: "Upload a fundus photo to see the result here." }),
      el("p", { text: "You get a screening verdict, a score for each condition, a plain-language explanation of anything flagged, and a map of the retinal regions that drove the result." }),
      el("ul", {},
        el("li", { text: "Use a retinal fundus photo, not a photo of the outside of the eye." }),
        el("li", { text: "Two photos (left and right eye) give the most accurate result." }),
        el("li", { text: "This is a research tool and does not replace an eye exam." }))));
  }
  showEmpty();

  let stopTimer = () => {};
  function showBusy() {
    stopTimer();
    const line = el("p", { class: "elapsed" });
    out.replaceChildren(el("section", { class: "busy" },
      el("h2", { text: "Analyzing the photo…" }),
      el("p", { text: "The model is reading the image. On a CPU this can take a few seconds to half a minute." }),
      line, el("div", { class: "track", "aria-hidden": "true" }, el("i"))));
    stopTimer = timer(line, "Running the model.");
  }

  function showError(msg) {
    stopTimer();
    out.replaceChildren(el("section", { class: "error", role: "alert" },
      el("h2", { text: "The analysis didn't finish" }), el("p", { text: msg })));
  }

  function renderResult(data) {
    stopTimer();
    const titles = { disease: "Possible disease detected", normal: "No disease detected", inconclusive: "Inconclusive result" };
    const top = data.classes[0];
    const flaggedNames = data.classes.filter(c => c.flagged && c.code !== "N").map(c => c.name);
    const sub = data.verdict === "disease" ? flaggedNames.join(", ")
      : data.verdict === "normal" ? "The model found nothing it associates with the conditions it knows."
      : `No condition passed its threshold. The highest score was ${top.name} at ${pct(top.prob)}.`;

    const parts = [];
    parts.push(el("section", { class: `verdict v-${data.verdict}` },
      el("h2", { text: titles[data.verdict] }),
      el("p", { class: "sub", text: sub }),
      el("p", { class: "meta", text: `Analyzed in ${data.seconds.toFixed(1)} seconds on ${data.device}.` })));
    if (data.single) parts.push(el("p", { class: "caveat", text: "You gave one image, so the model used it for both eyes. Results can be less accurate than with a photo of each eye." }));
    if (data.conflict) parts.push(el("p", { class: "caveat", text: "The model also flagged Normal, so its answer is mixed. Treat this result with extra caution." }));

    const list = el("ul", { class: "scores" });
    for (const c of data.classes) {
      list.append(el("li", { class: c.flagged ? "flag" : "" },
        el("span", { class: "nm" }, c.name, c.flagged ? el("span", { class: "tag", text: "Flagged" }) : null),
        el("span", { class: "bar", role: "img", "aria-label": `${c.name}: ${pct(c.prob)}` }, el("i", { style: `width:${Math.max(c.prob * 100, 1)}%` })),
        el("span", { class: "val", text: pct(c.prob) })));
    }
    parts.push(el("section", { class: "sec" },
      el("h2", { text: "Score for each condition" }),
      el("p", { class: "lead", text: "Scores are independent, so they don't add up to 100%. A condition is flagged when its score passes the threshold the model learned for that condition." }),
      list));

    if (data.details.length) {
      const sec = el("section", { class: "sec" },
        el("h2", { text: data.verdict === "disease" ? "What was flagged" : "About this result" }));
      for (const d of data.details) {
        sec.append(el("article", { class: "detail" },
          el("h3", { text: d.name }),
          el("div", { class: "rel" },
            el("span", { class: "relbar", "aria-hidden": "true" }, el("i", { style: `width:${Math.round((d.f1 || 0) * 100)}%` })),
            el("span", { text: `Model reliability for this condition: F1 ${(d.f1 || 0).toFixed(2)} on its own validation data` })),
          d.unreliable ? el("p", { class: "weak", text: "The model is weak on this condition, so treat the flag as a faint signal and not a finding." }) : null,
          el("dl", { class: "facts" },
            el("dt", { text: "What it is" }), el("dd", { text: d.what }),
            el("dt", { text: "Typical signs" }), el("dd", { text: d.signs }),
            el("dt", { text: "Why it matters" }), el("dd", { text: d.risk }),
            el("dt", { text: "Suggested next step" }), el("dd", { text: d.next }))));
      }
      parts.push(sec);
    }

    let heatBox = null;
    if (data.explain_code && $("#wantHeat").checked) {
      heatBox = el("section", { class: "sec" });
      parts.push(heatBox);
    }
    parts.push(el("p", { class: "disclaimer", text: "This is a research model that has not been clinically validated. Its output is not a diagnosis. See an eye doctor to confirm any finding." }));
    out.replaceChildren(...parts);
    window.scrollTo({ top: 0, behavior: "smooth" });
    return heatBox;
  }

  function compare(eye) {
    const wrap = el("div", { class: "compare", style: "--pos:50%" });
    wrap.append(
      el("img", { src: eye.original, alt: `${eye.eye} eye, original photo` }),
      el("img", { class: "over", src: eye.overlay, alt: `${eye.eye} eye with the region map on top` }),
      el("span", { class: "handle", "aria-hidden": "true" }));
    const range = el("input", { type: "range", min: "0", max: "100", value: "50", "aria-label": "Slide to compare the original photo with the region map" });
    const set = v => { wrap.style.setProperty("--pos", v + "%"); range.value = v; };
    range.addEventListener("input", () => set(range.value));
    const fromPointer = e => {
      const r = wrap.getBoundingClientRect();
      set(Math.min(100, Math.max(0, ((e.clientX - r.left) / r.width) * 100)));
    };
    wrap.addEventListener("pointerdown", e => { wrap.setPointerCapture(e.pointerId); fromPointer(e); wrap.onpointermove = fromPointer; });
    for (const ev of ["pointerup", "pointercancel"]) wrap.addEventListener(ev, () => { wrap.onpointermove = null; });
    return el("div", {}, wrap, el("div", { class: "slider" }, el("span", { text: "Original" }), range, el("span", { text: "Region map" })));
  }

  async function loadHeatmap(data, id, box) {
    const line = el("p", { class: "pending" });
    box.replaceChildren(el("h2", { text: "Regions that drove the result" }), line);
    const stop = timer(line, "Hiding parts of the image one at a time to see what matters. This runs the model many times.");
    try {
      const r = await fetch("/api/explain", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: data.token, code: data.explain_code, grid: 6 }),
      });
      const j = await r.json().catch(() => ({ error: "The server sent an unreadable reply." }));
      if (!r.ok) throw new Error(j.error || "Could not build the region map.");
      if (id !== runId) return;
      stop();
      const holder = el("div");
      const show = i => holder.replaceChildren(compare(j.eyes[i]));
      const head = [el("h2", { text: "Regions that drove the result" }),
        el("p", { class: "lead", text: `Shown for ${j.name}, the strongest flagged condition.` })];
      let tabs = null;
      if (j.eyes.length > 1) {
        tabs = el("div", { class: "eyes", role: "group", "aria-label": "Eye" });
        j.eyes.forEach((e, i) => tabs.append(el("button", { type: "button", "aria-pressed": String(i === 0), text: e.eye === "left" ? "Left eye" : "Right eye",
          onclick: () => { [...tabs.children].forEach((b, k) => b.setAttribute("aria-pressed", String(k === i))); show(i); } })));
      }
      show(0);
      box.replaceChildren(...head, tabs, holder,
        el("p", { class: "cap", text: "Warmer colors mark areas where hiding the image lowered the model's confidence the most. This shows where the model looked, not a clinical finding." }));
    } catch (e) {
      stop();
      if (id !== runId) return;
      box.replaceChildren(el("h2", { text: "Regions that drove the result" }),
        el("p", { class: "pending", text: (e && e.name === "TypeError") ? "Can't reach the server. Check that python app.py is still running." : e.message }));
    }
  }

  /* ---------------- analyze ---------------- */
  function setBusy(b) { go.dataset.busy = b ? "1" : "0"; go.textContent = b ? "Analyzing…" : "Analyze image"; updateGo(); }

  async function analyze() {
    const id = ++runId;
    const fd = new FormData();
    if (mode === "single") fd.append("image", files.image);
    else if (files.left && files.right) { fd.append("left", files.left); fd.append("right", files.right); }
    else fd.append("image", files.left || files.right);
    fd.append("tta", $("#fast").checked ? "0" : "1");

    setBusy(true);
    showBusy();
    let data;
    try {
      const r = await fetch("/api/predict", { method: "POST", body: fd });
      data = await r.json().catch(() => ({ error: "The server sent an unreadable reply." }));
      if (!r.ok) throw new Error(data.error || "Analysis failed.");
    } catch (e) {
      if (id !== runId) return;
      showError((e && e.name === "TypeError") ? "Can't reach the server. Check that python app.py is still running, then try again." : e.message);
      setBusy(false);
      return;
    }
    if (id !== runId) return;
    const heatBox = renderResult(data);
    setBusy(false);
    if (heatBox) loadHeatmap(data, id, heatBox);
  }
  go.addEventListener("click", analyze);
  setMode("single");
})();
</script>
</body>
</html>
